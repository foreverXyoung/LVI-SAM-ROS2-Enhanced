/**:
  ros__parameters:
    # MID-360 visual profile. Camera intrinsics and T_cam_radar were supplied
    # from the robot's calibration result on 2026-08-13. The supplied matrix
    # follows p_camera_optical = T_cam_radar * p_lidar.
    PROJECT_NAME: "lvi_sam"
    imu_topic: "/livox/imu"
    odom_topic: "/odometry/imu"
    image_topic: "/camera/color/image_raw"
    point_cloud_topic: "/lio_sam/deskew/cloud_deskewed"

    # Enable calibrated LiDAR depth first. Keep the odometry initialization and
    # global visual/LiDAR alignment as separate commissioning steps so a timing
    # or frame issue cannot affect every coupling path at once.
    use_lidar: 1
    use_lidar_odometry_prior: 0
    lidar_skip: 3
    align_camera_lidar_estimation: 0

    # Physical LiDAR -> virtual ROS forward/left/up depth frame at the camera
    # origin. Converted from T_cam_radar using
    # R_depth_optical = [[0,0,1],[-1,0,0],[0,-1,0]]. Rotation uses
    # Rz*Ry*Rx radians, matching pcl::getTransformation.
    lidar_to_cam_tx: -0.081972593017417
    lidar_to_cam_ty: -0.044175299800737
    lidar_to_cam_tz:  0.144969384854964
    lidar_to_cam_rx: -0.021612647911946
    lidar_to_cam_ry:  0.544036086503004
    lidar_to_cam_rz: -0.016580205374355

    model_type: "pinhole"
    camera_name: "camera_color"
    image_width: 640
    image_height: 400
    distortion_parameters:
      k1: -0.031267859041690826
      k2: 0.034638021141290665
      p1: 0.00011125089804409072
      p2: 0.0003588180697988719
    projection_parameters:
      fx: 305.593505859735
      fy: 305.7058330078125
      cx: 318.81414794921875
      cy: 199.78807067871094

    # Overridden by params_imu_mid360.yaml when launched through run.launch.py.
    acc_n: 0.02
    gyr_n: 0.01
    acc_w: 0.002
    gyr_w: 4.0e-5
    g_norm: 9.805
    imuAccelerationScale: 9.80665

    # Camera optical frame -> MID-360 built-in IMU. This is derived from the
    # calibrated T_cam_radar plus FAST-LIO's reference MID-360 IMU->LiDAR
    # lever arm [-0.011, -0.02329, 0.04412] m. Keep online refinement enabled
    # until the exact device lever arm has also been measured.
    estimate_extrinsic: 1
    extrinsicRotation: [ 0.014185814836858,  0.517593581056244,  0.855508999079956,
                        -0.999814492115821,  0.018490916911956,  0.005391414187168,
                        -0.013028584443324, -0.855426777019008,  0.517759872089634]
    extrinsicTranslation: [0.133536851431585, 0.023999669985422, -0.036873032753594]

    max_cnt: 150
    min_dist: 20
    freq: 20
    F_threshold: 1.0
    show_track: 1
    equalize: 1
    fisheye: 0

    max_solver_time: 0.035
    max_num_iterations: 10
    keyframe_parallax: 10.0

    estimate_td: 0
    td: 0.0
    rolling_shutter: 0
    rolling_shutter_tr: 0.0

    loop_closure: 1
    skip_time: 0.0
    skip_dist: 0.0
    loop_sync_tolerance: 0.02
    loop_min_index_gap: 200
    loop_primary_score_threshold: 0.05
    loop_secondary_score_threshold: 0.015
    debug_image: 0
    match_image_scale: 0.5
    vocabulary_file: "config/brief_k10L6.bin"
    brief_pattern_file: "config/brief_pattern.yaml"
    vins_config_file: "config/params_camera_mid360.yaml"
